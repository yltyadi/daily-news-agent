# ==============================================================================
# Конфигурация новостного агента (Daily & Monthly News Agent)
# - Ежедневный запуск: через cron-job.org в 19:00 по времени Алматы (Asia/Almaty)
# - Ежемесячный запуск: через cron-job.org 1-го числа месяца в 09:00 (Asia/Almaty)
# ==============================================================================

schedule:
  timezone: "Asia/Almaty"
  daily_time: "19:00"
  monthly_day: 1
  monthly_time: "09:00"

general:
  lookback_hours: 24                # За сколько часов собирать посты и письма в ежедневном режиме
  monthly_lookback_days: 32         # За сколько дней брать дайджесты в ежемесячном режиме
  daily_digests_retention_days: 45  # Автоочистка старых JSON-дайджестов старше 45 дней
  language: "ru"
  save_local_markdown: true
  daily_digests_dir: "data/daily_digests"

# Настройки моделей (Option A: баланс максимального качества и сниженной цены)
# - router_model (gemini-3.1-flash-lite): быстрая маршрутизация по 10 категориям (RU + KZ)
# - model (gemini-3.8-flash): глубокий анализ по каждой категории и межкатегорийные связи
llm:
  router_model: "gemini-3.1-flash-lite"
  router_thinking_level: "minimal"
  router_pricing_per_1m_tokens:
    input_usd: 0.25
    output_usd: 1.50
    cached_input_usd: 0.025

  model: "gemini-3.8-flash"
  thinking_level: "low"             # minimal | low | medium | high
  temperature: 0.2
  batch_size_items: 40
  max_concurrent_llm_calls: 5
  pricing_per_1m_tokens:
    input_usd: 0.75                 # $0.75 / 1M input tokens для gemini-3.8-flash
    output_usd: 3.75                # $3.75 / 1M output + thinking tokens для gemini-3.8-flash
    cached_input_usd: 0.075

# Источники: Telegram-каналы (читаются ВСЕ посты за последние 24 часа + умная подгрузка статей глубины 1 + дедупликация)
telegram:
  enabled: true
  read_nested_articles: true        # Подгружать статьи по ссылкам (akorda.kz, telegra.ph, СМИ — глубина 1 без мусора)
  deduplicate_before_llm: true      # Убирать двуязычные дубли KZ/RU и копипасту между каналами ДО отправки в LLM
  # Приоритетные официальные каналы (никогда не отбрасываются роутером + проверка полноты в Stage 2)
  # Формат: username_канала: категория_по_умолчанию
  priority_channels:
