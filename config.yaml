  enabled: true
  imap_host: "imap.gmail.com"
  imap_port: 993
  folder: "INBOX"
  allowed_senders: []

# Доставка готового отчёта
delivery:
  publish_telegraph: true
  send_telegram_bot: true
  send_email_digest: true
  smtp_host: "smtp.gmail.com"
  smtp_port: 465

# 8 целевых категорий (каждая имеет свой независимый агент и skill-файл в папке skills/)
