# ==============================================================================
# Конфигурация новостного агента (Daily & Monthly News Agent)
# Меняйте расписание, каналы и настройки прямо в этом файле.
# После изменения времени в блоке schedule выполните:
#   python -m src.main --sync-schedule
# ==============================================================================

schedule:
  timezone: "Asia/Almaty"
  daily_time: "21:00"               # Во сколько запускать ежедневный дайджест каждый день
  monthly_day: 1                    # Какого числа месяца запускать месячный отчёт (1 = 1-е число)
  monthly_time: "09:00"             # Во сколько запускать месячный отчёт

general:
  lookback_hours: 24                # За сколько часов собирать посты и письма в ежедневном режиме
  monthly_lookback_days: 32         # За сколько дней брать дайджесты в ежемесячном режиме
  language: "ru"
  save_local_markdown: true
  daily_digests_dir: "data/daily_digests"

# Настройки моделей и тарификации (в USD за 1 млн токенов)
# Для экономии ~85% бюджета без потери качества:
# - router_model (gemini-3.1-flash-lite) быстро фильтрует спам и распределяет посты по 8 категориям
# - model (gemini-3.8-flash) пишет глубокую аналитику по каждой категории и ищет связи
llm:
  router_model: "gemini-3.1-flash-lite"
  router_thinking_level: "minimal"
  router_pricing_per_1m_tokens:
    input_usd: 0.25
    output_usd: 1.50
    cached_input_usd: 0.025

  model: "gemini-3.8-flash"
  thinking_level: "low"             # minimal | low | medium | high
  temperature: 0.2
  pricing_per_1m_tokens:
    input_usd: 0.75                 # $0.75 / 1M input tokens для gemini-3.8-flash
    output_usd: 3.75                # $3.75 / 1M output + thinking tokens для gemini-3.8-flash
    cached_input_usd: 0.075

