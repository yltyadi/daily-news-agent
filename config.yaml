# 10 целевых категорий (каждая имеет свой независимый агент и skill-файл в папке skills/)
categories:
  - slug: "politika"
    title: "🏛️ Политика"
    description: "Выступления, встречи, поручения и указы Президента РК (Токаева / Акорда), работа Правительства и Парламента, кадровые назначения в РК; региональная политика Центральной Азии (Узбекистан, Кыргызстан, Таджикистан, Туркменистан, Азербайджан, ОТГ, ЕАЭС, ШОС); ключевая мировая геополитика, санкции и международная безопасность."
    skill_file: "skills/09_politika.md"
    subsections:
      - "🇰🇿 Казахстан"
      - "🌏 Центральная Азия"
      - "🌍 Мир"

  - slug: "energetika"
    title: "⚡ Энергетика"
    description: "Электроэнергетика, генерация (ТЭЦ, ГРЭС, ВИЭ, АЭС), сети (KEGOC, РЭК), нефть, газ, уголь, НПЗ, тарифы на энергию, дефицит/профицит мощностей."
    skill_file: "skills/01_energetika.md"

  - slug: "voda"
    title: "💧 Вода"
    description: "Водные ресурсы, водохранилища, трансграничные реки, ирригация, водоканалы, ЖКХ водоснабжения, тарифы на воду, засуха, паводки, экология воды."
    skill_file: "skills/02_voda.md"

  - slug: "lokalizatsiya"
    title: "🏭 Локализация и производство в РК"
    description: "Новые заводы и промышленные проекты в РК, импортозамещение, офтейк-контракты, внутристрановая ценность (местное содержание), глубокая переработка сырья, машиностроение, стройматериалы, СЭЗ, меры поддержки Минпромстроя РК + идеи и тенденции локализации."
    skill_file: "skills/10_lokalizatsiya.md"
    ideas_section_title: "💡 Идеи и тенденции локализации в РК"

  - slug: "avtomatizatsiya"
    title: "🤖 Автоматизация (промышленность и идеи)"
    description: "Конкретные примеры автоматизации в промышленности, энергетике, логистике и бизнесе (АСУ ТП, SCADA, ERP, MES, IIoT, роботы, AI-агенты) + практические идеи для внедрения."
    skill_file: "skills/04_avtomatizatsiya.md"
    ideas_section_title: "💡 Прикладные идеи для автоматизации"

  - slug: "it"
    title: "💻 IT (общая глобальная движуха)"
    description: "Глобальные и локальные тренды IT, релизы AI-моделей и техногигантов, облака, кибербезопасность, стартапы, венчур, Astana Hub, цифровизация."
    skill_file: "skills/03_it.md"

  - slug: "finansy"
    title: "📈 Финансы (акции, МФЦА, инвестирование)"
    description: "Фондовый рынок (KASE, AIX и мировые рынки), акции, облигации, дивиденды, специальные режимы и новости МФЦА (AIFC), инвестиционные фонды, банки, ставки НБК, курс тенге."
    skill_file: "skills/05_finansy.md"

  - slug: "nalogi"
    title: "🧾 Налоги (законодательство и практика)"
    description: "Налоговый кодекс, реформы НДС, КПН, ИПН, специальные налоговые режимы, инициативы КГД МФ РК, налоговое администрирование, проверки, отчётность."
    skill_file: "skills/06_nalogi.md"

  - slug: "yuridicheskie"
    title: "⚖️ Юридические изменения в законодательстве"
    description: "Конкретные изменения законов, кодексов, НПА, приказов министерств, акты и проверки прокуратуры, антимонопольные дела АЗРК, судебные прецеденты, штрафы, лицензирование и комплаенс (общеполитические заявления идут в politika)."
    skill_file: "skills/07_yuridicheskie.md"

  - slug: "svyaz_transport"
    title: "📡 Связь и транспорт (Казахтелеком, перевозки, трубопроводы)"
    description: "Телекоммуникации (Казахтелеком, операторы связи, 5G, интернет-инфраструктура), ж/д и автоперевозки (КТЖ, ТМТМ / Средний коридор), авиация, порты, нефте- и газопроводы (КазТрансОйл, КТК)."
    skill_file: "skills/08_svyaz_transport.md"

