name: Daily & Monthly News Brief

on:
  # Запуск осуществляется ровно по секундам через cron-job.org (workflow_dispatch)
  # или вручную из вкладки Actions.
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска: daily (за 24ч), monthly (итоги месяца) или bookmarks (синхронизация заметок)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - monthly
          - bookmarks

permissions:
  contents: write

jobs:
  build-and-send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Run News Agent (${{ inputs.mode || 'daily' }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
        run: |
          python -m src.main --mode "${{ inputs.mode || 'daily' }}"

      - name: Upload Markdown Brief Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-brief-${{ inputs.mode || 'daily' }}
          path: output/*.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Save daily digest archive, bookmarks & token/cost history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/daily_digests
          touch data/saved_bookmarks.json
          git add -A data/usage_history.json data/daily_digests/ data/saved_bookmarks.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: save digest archive, bookmarks and LLM usage stats [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
